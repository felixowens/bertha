[env]
# Queries are checked at compile time against `.sqlx/` (see scripts/sqlx-prepare.sh).
# Set SQLX_OFFLINE=false and DATABASE_URL to check against a live database instead.
SQLX_OFFLINE = "true"
# ts-rs writes the generated TypeScript (src/api/generated, sdk/src/generated) from the
# repo root whenever bertha-core's tests run.
TS_RS_EXPORT_DIR = { value = "..", relative = true }
