[workspace]
resolver = "3"
members = ["crates/bertha-core", "crates/bertha-db"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bertha-core = { path = "crates/bertha-core" }
bertha-db = { path = "crates/bertha-db" }
bertha-ingest = { path = "crates/bertha-ingest" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "json"] }
tracing = "0.1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
regex = "1"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
