[package]
name = "bertha-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bertha"
path = "src/main.rs"

[features]
# Seeds from the fixtures built into the binary (`bertha seed --builtin`).
fixtures = ["bertha-db/testing"]

[dependencies]
bertha-core.workspace = true
bertha-db.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace", "limit", "set-header", "timeout"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring", "hostname"] }
rust-embed = { version = "8", features = ["mime-guess"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
bertha-db = { workspace = true, features = ["testing"] }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
