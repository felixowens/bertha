name: release

# Push a tag like v0.3.0 (scripts/release.sh does it). Builds static Linux binaries
# with the app embedded and attaches them to a GitHub release, which deploy/install.sh
# downloads, along with the SDK as an npm tarball.
#
# Nothing is built until the gate passes (the tag matches every version and its commit
# is on main) and the whole ci workflow passes again on the tagged commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: scripts/release-gate.sh --no-ci "$GITHUB_REF_NAME" HEAD

  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml

  frontend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  binary:
    needs: frontend
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: dist, path: dist/ }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server, key: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p bertha-server
        working-directory: server
      - name: Package
        run: |
          out="bertha-${{ matrix.target }}.tar.gz"
          bin="server/target/${{ matrix.target }}/release/bertha"
          "$bin" --version | grep -qx "bertha ${GITHUB_REF_NAME#v}" || { echo "The binary says $("$bin" --version), the tag says $GITHUB_REF_NAME"; exit 1; }
          tar -czf "$out" -C "$(dirname "$bin")" bertha
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bertha-${{ matrix.target }}
          path: bertha-${{ matrix.target }}.tar.gz*

  sdk:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci && npm run build && npm pack
        working-directory: sdk
      - uses: actions/upload-artifact@v4
        with: { name: bertha-sdk, path: sdk/bertha-sdk-*.tgz }

  publish:
    needs: [binary, sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { pattern: bertha-*, merge-multiple: true }
      # A tag with a suffix (v0.3.0-rc.1) is a prerelease, which install.sh skips.
      - run: |
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${pre[@]}" \
            bertha-*.tar.gz bertha-*.tar.gz.sha256 bertha-sdk-*.tgz
        env: { GH_TOKEN: "${{ github.token }}" }
