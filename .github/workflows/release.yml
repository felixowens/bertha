name: release

# Push a tag like v0.3.0 (scripts/release.sh does it). Builds static Linux binaries
# with the app embedded and attaches them to a GitHub release, which deploy/install.sh
# downloads, along with the SDK as an npm tarball. Then the SDK goes to npm as
# @bigbertha/sdk and the Rust SDK to crates.io as bigbertha, both by trusted publishing
# (no tokens; each registry trusts this workflow file).
#
# Nothing starts until the gate passes (the tag matches every version and its commit is
# on main). The builds then run alongside the whole ci workflow on the tagged commit, and
# nothing is published unless both pass.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: scripts/release-gate.sh --no-ci "$GITHUB_REF_NAME" HEAD

  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml

  frontend:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  binary:
    needs: frontend
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: dist, path: dist/ }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # No rust-cache: a cache saved on a tag can only be read by that same tag.
      - run: rustup target add ${{ matrix.target }}
        working-directory: server
      - run: cargo build --release --locked --target ${{ matrix.target }} -p bertha-server
        working-directory: server
      - name: Package
        run: |
          out="bertha-${{ matrix.target }}.tar.gz"
          bin="server/target/${{ matrix.target }}/release/bertha"
          "$bin" --version | grep -qx "bertha ${GITHUB_REF_NAME#v}" || { echo "The binary says $("$bin" --version), the tag says $GITHUB_REF_NAME"; exit 1; }
          tar -czf "$out" -C "$(dirname "$bin")" bertha
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bertha-${{ matrix.target }}
          path: bertha-${{ matrix.target }}.tar.gz*

  sdk:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci && npm run build && npm pack
        working-directory: sdk
      - uses: actions/upload-artifact@v4
        with: { name: bigbertha-sdk, path: sdk/bigbertha-sdk-*.tgz }

  publish:
    needs: [ci, binary, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { pattern: "*bertha-*", merge-multiple: true }
      # A tag with a suffix (v0.3.0-rc.1) is a prerelease, which install.sh skips.
      - run: |
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${pre[@]}" \
            bertha-*.tar.gz bertha-*.tar.gz.sha256 bigbertha-sdk-*.tgz
        env: { GH_TOKEN: "${{ github.token }}" }

  # The same tarball that's on the GitHub release. npm checks that it comes from this
  # repo's release.yml (set under the package's settings on npmjs.com), so there's no
  # token to leak. It runs after the GitHub release, and skips a version npm already
  # has, so a failed run can be re-run: gh run rerun <id> --failed.
  npm:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v5
        with: { name: bigbertha-sdk }
      - name: Publish
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$(npm view "@bigbertha/sdk@$v" version 2>/dev/null)" == "$v" ]]; then
            echo "@bigbertha/sdk@$v is already on npm."; exit 0
          fi
          # A prerelease goes out as "next", so npm install still gets the last release.
          tag=latest; [[ "$v" == *-* ]] && tag=next
          npm publish "bigbertha-sdk-$v.tgz" --tag "$tag"

  # The Rust SDK. crates.io trusts this repo's release.yml (set under the crate's settings
  # on crates.io) and hands out a short-lived token, so there's none to leak. It skips a
  # version crates.io already has, so a failed run can be re-run.
  crates:
    needs: publish
    runs-on: ubuntu-24.04
    # Until crates.io trusts this workflow, a failed publish mustn't fail the release.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
        working-directory: server
      - name: Already published?
        id: check
        run: |
          v="${GITHUB_REF_NAME#v}"
          if curl -sfA "bertha release (github.com/felixowens/bertha)" "https://crates.io/api/v1/crates/bigbertha/$v" >/dev/null; then
            echo "bigbertha $v is already on crates.io."; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.done != 'true'
        id: auth
      - run: cargo publish --locked -p bigbertha
        if: steps.check.outputs.done != 'true'
        working-directory: server
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}" }
