name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the whole suite on the tagged commit

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc -p e2e/tsconfig.json
      - run: node .prototype/design-lint.ts
      - run: npx -p typescript tsc -p packet
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo fmt --all --check
        working-directory: server
      - run: cargo clippy -q --workspace --all-features --tests -- -D warnings
        working-directory: server
      - run: cargo clippy -q --workspace --tests -- -D warnings
        working-directory: server
      - run: cargo test -q --workspace --all-features
        working-directory: server
      - name: Generated types are up to date
        run: git diff --exit-code src/api/generated sdk/src/generated

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: npm run check
        working-directory: sdk
      - run: npm test
        working-directory: sdk
      - run: npm run size
        working-directory: sdk

  # The real binary, built once with the test knobs, under the SDK's and the app's
  # end-to-end suites.
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, server, sdk]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server, key: e2e }
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --features fixtures
        working-directory: server
      - run: npm ci
        working-directory: sdk
      - run: npm run e2e
        working-directory: sdk
        env: { BERTHA_BIN: "${{ github.workspace }}/server/target/release/bertha" }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results/
          retention-days: 7
