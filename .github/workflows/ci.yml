name: ci

# Not on every push to main, to save minutes. It runs:
# - from release.yml, on every v* tag, before anything is built;
# - by hand: gh workflow run ci.yml (or the Actions tab), on main or any branch;
# - on pull requests, if you open one;
# - weekly on main. Caches made on a tag can only be read by that tag, so this run is
#   what keeps a cache on main for the next release to start from (about 6 minutes).
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough for a backtrace; full debug info makes linking and the cache slow.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc -p e2e/tsconfig.json
      - run: node .prototype/design-lint.ts
      - run: npx -p typescript tsc -p packet
      - run: npm run build

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
        working-directory: server
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo fmt --all --check
        working-directory: server
      - run: cargo clippy -q --workspace --all-features --tests -- -D warnings
        working-directory: server
      - run: cargo clippy -q --workspace --tests -- -D warnings
        working-directory: server
      - run: cargo test -q --workspace --all-features
        working-directory: server
      - name: Generated types are up to date
        run: git diff --exit-code src/api/generated sdk/src/generated

  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: npm run check
        working-directory: sdk
      - run: npm test
        working-directory: sdk
      - run: npm run size
        working-directory: sdk

  # The real binary, built once with the test knobs, under the SDK's and the app's
  # end-to-end suites. It runs alongside the other jobs rather than after them, and uses
  # the e2e profile (release without LTO), which builds in half the time.
  e2e:
    runs-on: ubuntu-24.04
    env: { BERTHA_BIN: "${{ github.workspace }}/server/target/e2e/bertha" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server, key: e2e, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: npm ci
      - run: npm run build
      - run: cargo build --profile e2e --features fixtures
        working-directory: server
      - run: npm ci
        working-directory: sdk
      - run: npm run e2e
        working-directory: sdk
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results/
          retention-days: 7
